name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go build & vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session-manager
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: session-manager/go.mod
          cache-dependency-path: session-manager/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  docker-session-manager:
    name: Docker build (session-manager)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t session-manager ./session-manager

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ShellCheck
        run: |
          shellcheck -S warning scripts/*.sh df-image-sdl/*.sh \
            df-image-sdl/s6/*/run df-image-sdl/s6/df/finish
